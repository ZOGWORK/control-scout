name: CI

# Every pull request (and push to main): types, tests, production build, then
# the performance budgets (scripts/perf.ts --budgets). A change that blows a
# budget fails the check:
#   home interactive < 3 s warm on throttled 4G · home API data < 100 KB
#   API p95 < 300 ms warm on the hot routes · cold start < 20 s to first paint
#   the home page never downloads the charts chunk
# The server under test starts from an empty database and restores the
# shipped snapshot, so the numbers use real data with no credentials.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04 on 2026-10-21, where Playwright has no Chromium build yet ("Playwright
    # does not support chromium on ubuntu26.04-x64"), so the browser install failed every run. Unpin once it does.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: npm run lint
      - run: npm test
      - name: Uptime script tests (fake curl and gh, no network)
        run: bash .github/scripts/uptime.test.sh
      - name: Changelog guard tests
        run: bash .github/scripts/changelog-guard.test.sh
      - run: npm run build
      # The VM starts the server from this bundle (scripts/build-server.mjs): a bundle that can't start fails here,
      # not on the live site. It must answer ready, and quickly (it restores the shipped snapshot first here).
      - name: Server bundle starts
        run: |
          DATA_DIR="$RUNNER_TEMP/csdata" DATABASE_URL="file:$RUNNER_TEMP/csdata/scout.db" PORT=3197 CS_NO_SCHEDULER=1 node --enable-source-maps build/server/index.mjs > "$RUNNER_TEMP/bundle.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3197/api/health 2>/dev/null | grep -q '"ready":true'; then
              echo "bundle ready after ${i}s"; curl -fsS -o /dev/null -w "home %{http_code}\n" http://127.0.0.1:3197/; kill %1; exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/bundle.log"; exit 1
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Performance budgets
        run: npm run perf -- --budgets --json perf.json
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf
          path: perf.json
          if-no-files-found: ignore
