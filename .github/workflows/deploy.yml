name: Deploy to Oracle VM

# Every push to main asks the Oracle VM to deploy that commit, the same way
# Control Point's commands reach the VM: append a command to the private queue
# sushilm20/control-point-commands (commands/pending.json). The VM's poller
# (/opt/bruno-commands, every 30 s) runs it: /opt/control-scout/bin/update
# fetches the commit with read-only credentials that live on the VM, builds it beside
# the live release, switches over and restarts. This job then waits until
# https://controlscout.org/api/health reports the new commit, and fails if it
# doesn't within 20 minutes. A second job checks that Render, the rollback
# host, rebuilt the same commit.
#
# Secret (repo Settings → Secrets and variables → Actions):
#   COMMANDS_REPO_TOKEN  fine-grained token, repository access: only
#                        sushilm20/control-point-commands, permission: Contents read & write.
# Without it the job skips with a warning (nothing is deployed).

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
permissions:
  contents: read

env:
  SITE: https://controlscout.org
  QUEUE_REPO: sushilm20/control-point-commands

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One VM deploy at a time; a newer push waits for the running one.
    concurrency:
      group: deploy-oracle
      cancel-in-progress: false
    steps:
      - name: Check for the queue token
        id: gate
        env:
          TOKEN: ${{ secrets.COMMANDS_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::COMMANDS_REPO_TOKEN secret is not set, skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Queue the deploy command
        if: steps.gate.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.COMMANDS_REPO_TOKEN }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${QUEUE_REPO}.git" queue
          cd queue
          git config user.name "control-scout deploy"
          git config user.email "actions@users.noreply.github.com"
          ID="cs-deploy-${SHA:0:7}-${RUN}"
          # The poller rewrites pending.json too; on a race, start again from its latest version.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet --depth 1 origin HEAD && git reset --quiet --hard FETCH_HEAD
            mkdir -p commands
            [ -f commands/pending.json ] || echo '{"commands":[]}' > commands/pending.json
            jq --arg id "$ID" --arg cmd "sudo /opt/control-scout/bin/update $SHA" \
              '.commands += [{id: $id, cmd: $cmd, timeout: 60}]' commands/pending.json > pending.tmp
            mv pending.tmp commands/pending.json
            git add commands/pending.json
            git commit --quiet -m "control-scout: deploy ${SHA:0:7}"
            if git push --quiet origin HEAD; then echo "Queued $ID"; exit 0; fi
            sleep $((attempt * 3))
          done
          echo "::error::Couldn't push to the command queue"; exit 1

      - name: Wait for the new release to be live
        if: steps.gate.outputs.ok == 'true'
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Live means: ready, running this commit or a newer one that contains it.
          contains() { [ "$1" = "$SHA" ] || [[ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$1" --jq .status 2>/dev/null)" =~ ^(ahead|identical)$ ]]; }
          deadline=$(( $(date +%s) + 20 * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -fsS --max-time 10 "$SITE/api/health" || true)
            rel=$(echo "$body" | jq -r '.release // empty' 2>/dev/null)
            if [ -n "$rel" ] && [ "$(echo "$body" | jq -r '.ready' 2>/dev/null)" = "true" ] && contains "$rel"; then
              echo "Live: $body"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$SITE didn't report release $SHA (or newer) within 20 minutes (last: ${body:-no answer}). On the VM: sudo tail -n 100 /var/log/control-scout-deploy.log"
          exit 1

  # Render (https://control-scout.onrender.com) is kept as the rollback host and
  # follows every update: it rebuilds from main on its own (auto-deploy on
  # push). This job proves it did, by waiting for its /api/health to report
  # the same commit. It needs no secrets, so it runs even without the queue token.
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Its own queue (never delays a VM deploy); a newer push replaces an older check.
    concurrency:
      group: render-check
      cancel-in-progress: true
    env:
      RENDER_SITE: https://control-scout.onrender.com
    steps:
      - name: Wait for Render to run the new release
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Render deploys main by itself: a newer commit that contains this one also counts.
          contains() { [ "$1" = "$SHA" ] || [[ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$1" --jq .status 2>/dev/null)" =~ ^(ahead|identical)$ ]]; }
          deadline=$(( $(date +%s) + 25 * 60 ))   # free-plan builds are slow
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -fsS --max-time 60 "$RENDER_SITE/api/health" || true)
            rel=$(echo "$body" | jq -r '.release // empty' 2>/dev/null)
            if [ -n "$rel" ] && [ "$(echo "$body" | jq -r '.ready' 2>/dev/null)" = "true" ] && contains "$rel"; then
              echo "Render live: $body"
              exit 0
            fi
            sleep 30
          done
          echo "::error::$RENDER_SITE didn't report release $SHA (or newer) within 25 minutes (last: ${body:-no answer}). Check the service's deploys in the Render dashboard (auto-deploy must be on for main)."
          exit 1
