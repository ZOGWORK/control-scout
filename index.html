<!doctype html>
<html lang="en" data-ui="modern">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FTC Control Scout — free FTC scouting & predictions</title>
    <meta name="description" content="Search any FTC team, event or match. OPR breakdowns, event-by-event trends, match predictions with a public track record, advancement odds for any team at any event — free, no login." />
    <!-- The brand icon (brand/favicon-master.png) as raster only: Google Search doesn't use SVG favicons, and an SVG link would win in modern browsers. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FTC Control Scout" />
    <meta property="og:title" content="FTC Control Scout" />
    <meta property="og:description" content="Free FTC scouting and predictions for every team — with a public track record of how often the predictions come true." />
    <link rel="preload" href="/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/SpaceGrotesk-700.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Page titles (h1) are Space Grotesk 600: the largest text above the fold. -->
    <link rel="preload" href="/fonts/SpaceGrotesk-600.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme before anything paints (no flash): here in <head>, ahead of the
      // static first paint the server puts in #root (server/bootShell.ts). Dark graphite is the default.
      try {
        var s = JSON.parse(localStorage.getItem('cs-personal:settings') || 'null');
        var t = s && s.value && s.value.theme;
        if (t === 'light' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.classList.add('light');
        if (s && s.value && s.value.density === 'compact') document.documentElement.classList.add('compact');
        // The static first paint's sidebar matches a collapsed one.
        if (localStorage.getItem('cs-sidebar') === '1') document.documentElement.classList.add('cs-sb-min');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--cs-boot--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
